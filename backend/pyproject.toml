[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long (legacy, will clean progressively)
    "E701",  # multiple statements on one line (stylistic preference)
]

[tool.ruff.lint.per-file-ignores]
"routes/bot.py" = ["F841", "F842"]      # llm_key kept for future feature flags
"routes/social.py" = ["F841"]           # receiver_new kept for audit trail
"routes/games.py" = ["F841"]            # intermediate calc vars kept for clarity
