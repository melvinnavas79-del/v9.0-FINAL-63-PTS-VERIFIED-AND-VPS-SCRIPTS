<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lluvia Live — Logo oficial (versión raster full-color)
  © 2026 Melvin H. Navas Hernández. Todos los derechos reservados.

  Este SVG embebe el master raster 1024×1024 y permite un escalado
  proporcional sin pérdidas perceptibles. Para usos estrictamente
  vectoriales (impresión grande, bordado) usar `logo-wordmark.svg`.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1024 1024"
     width="1024" height="1024"
     preserveAspectRatio="xMidYMid meet">
  <title>Lluvia Live</title>
  <desc>Logotipo oficial de Lluvia Live con corona real y gotas doradas.</desc>
  <image x="0" y="0" width="1024" height="1024"
         xlink:href="logo-lluvia-live-master.png"
         preserveAspectRatio="xMidYMid meet"/>
</svg>
